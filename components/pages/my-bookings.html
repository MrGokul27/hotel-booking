<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Bookings - Stackly Hotel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Jost:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <link rel="stylesheet" href="../../assets/css/styles.css" />
    <link rel="stylesheet" href="../../assets/css/dashboard.css" />
    <style>
      .booking-card {
        background: var(--white);
        border: 1px solid #ede8e0;
        border-radius: 10px;
        overflow: hidden;
        transition: all 0.22s;
        margin-bottom: 16px;
      }
      .booking-card:hover {
        box-shadow: 0 6px 24px rgba(184, 154, 96, 0.12);
        border-color: rgba(184, 154, 96, 0.35);
      }
      .booking-card-header {
        background: linear-gradient(135deg, var(--dark), #2a221a);
        padding: 18px 22px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
      }
      .booking-id {
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.55);
      }
      .booking-room {
        font-family: "Cormorant Garamond", serif;
        font-size: 1.4rem;
        font-weight: 700;
        color: var(--white);
      }
      .booking-card-body {
        padding: 20px 22px;
        display: flex;
        gap: 24px;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
      }
      .booking-detail {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .booking-detail .lbl {
        font-size: 10px;
        font-weight: 500;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--gold);
      }
      .booking-detail .val {
        font-size: 14px;
        color: var(--dark);
        font-weight: 400;
      }
      .booking-actions {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }
    </style>
  </head>
  <body>
    <div class="db-wrapper">
      <aside class="db-sidebar" id="db-sidebar"></aside>
      <div class="db-sidebar-overlay" id="db-overlay"></div>
      <div class="db-main">
        <header class="db-topbar">
          <div class="db-topbar-left">
            <button class="db-menu-toggle" id="db-menu-toggle">
              <i class="fa-solid fa-bars"></i>
            </button>
            <div>
              <div class="db-page-title">My Bookings</div>
              <div class="db-breadcrumb" id="db-breadcrumb">
                My Stay · Current Reservations
              </div>
            </div>
          </div>
          <div class="db-topbar-right">
            <div class="db-topbar-date" id="db-date"></div>
            <button class="db-notif-btn">
              <i class="fa-regular fa-bell"></i
              ><span class="db-notif-badge"></span>
            </button>
            <div class="db-topbar-user">
              <div class="db-topbar-avatar" id="topbar-avatar">S</div>
              <span class="db-topbar-name" id="topbar-name">Guest</span>
            </div>
          </div>
        </header>
        <main class="db-content">
          <div class="db-kpi-grid" style="margin-bottom: 28px">
            <div class="db-kpi-card">
              <div class="db-kpi-header">
                <span class="db-kpi-label">Active Bookings</span>
                <div class="db-kpi-icon"><i class="fa-solid fa-bed"></i></div>
              </div>
              <div class="db-kpi-value">1</div>
              <div class="db-kpi-trend neutral">
                <i class="fa-solid fa-minus"></i> Currently staying
              </div>
            </div>
            <div class="db-kpi-card">
              <div class="db-kpi-header">
                <span class="db-kpi-label">Upcoming</span>
                <div class="db-kpi-icon">
                  <i class="fa-solid fa-calendar-days"></i>
                </div>
              </div>
              <div class="db-kpi-value">2</div>
              <div class="db-kpi-trend neutral">
                <i class="fa-solid fa-minus"></i> Next 60 days
              </div>
            </div>
            <div class="db-kpi-card">
              <div class="db-kpi-header">
                <span class="db-kpi-label">Total Nights Booked</span>
                <div class="db-kpi-icon"><i class="fa-solid fa-moon"></i></div>
              </div>
              <div class="db-kpi-value">14</div>
              <div class="db-kpi-trend up">
                <i class="fa-solid fa-arrow-trend-up"></i> This year
              </div>
            </div>
            <div class="db-kpi-card">
              <div class="db-kpi-header">
                <span class="db-kpi-label">Points Earned</span>
                <div class="db-kpi-icon"><i class="fa-solid fa-star"></i></div>
              </div>
              <div class="db-kpi-value">2,450</div>
              <div class="db-kpi-trend up">
                <i class="fa-solid fa-arrow-trend-up"></i> From bookings
              </div>
            </div>
          </div>

          <div
            style="
              display: flex;
              align-items: center;
              justify-content: space-between;
              margin-bottom: 20px;
              flex-wrap: wrap;
              gap: 12px;
            "
          >
            <div class="db-section-title">Your Reservations</div>
            <a
              href="../../index.html"
              class="btn-gold"
              style="font-size: 11px; padding: 9px 20px"
              ><i class="fa-solid fa-plus me-2"></i>New Booking</a
            >
          </div>

          <div id="bookings-list"></div>
        </main>
      </div>
    </div>
    <script src="../../assets/js/db-shell.js"></script>
    <script>
      const bookings = [
        {
          id: "BK-1042",
          room: "Suite 501",
          type: "Luxury Suite",
          checkin: "12 Jul 2025",
          checkout: "15 Jul 2025",
          nights: 3,
          guests: 2,
          total: "$1,290",
          status: "checkedin",
          amenities: "King Bed · Sea View · Balcony",
        },
        {
          id: "BK-1055",
          room: "Deluxe 204",
          type: "Deluxe Room",
          checkin: "10 Aug 2025",
          checkout: "13 Aug 2025",
          nights: 3,
          guests: 1,
          total: "$870",
          status: "confirmed",
          amenities: "Queen Bed · City View · Minibar",
        },
        {
          id: "BK-1058",
          room: "Standard 108",
          type: "Standard Room",
          checkin: "20 Sep 2025",
          checkout: "22 Sep 2025",
          nights: 2,
          guests: 2,
          total: "$350",
          status: "confirmed",
          amenities: "Double Bed · Garden View",
        },
      ];
      const statusEl = {
        confirmed: `<span class="db-badge db-badge-confirmed">Confirmed</span>`,
        checkedin: `<span class="db-badge db-badge-checkedin">Checked In</span>`,
        pending: `<span class="db-badge db-badge-pending">Pending</span>`,
      };
      document.getElementById("bookings-list").innerHTML = bookings
        .map(
          (b) => `
  <div class="booking-card">
    <div class="booking-card-header">
      <div><div class="booking-id">${b.id}</div><div class="booking-room">${b.room} · ${b.type}</div></div>
      ${statusEl[b.status] || ""}
    </div>
    <div class="booking-card-body">
      <div class="booking-detail"><div class="lbl">Check-In</div><div class="val">${b.checkin}</div></div>
      <div class="booking-detail"><div class="lbl">Check-Out</div><div class="val">${b.checkout}</div></div>
      <div class="booking-detail"><div class="lbl">Nights</div><div class="val">${b.nights}</div></div>
      <div class="booking-detail"><div class="lbl">Guests</div><div class="val">${b.guests}</div></div>
      <div class="booking-detail"><div class="lbl">Total</div><div class="val" style="color:var(--gold);font-weight:500;">${b.total}</div></div>
      <div class="booking-detail"><div class="lbl">Amenities</div><div class="val" style="font-size:12px;">${b.amenities}</div></div>
      <div class="booking-actions">
        <a href="#" class="btn-outline-gold" style="font-size:11px;padding:8px 16px;">View Details</a>
        ${b.status === "confirmed" ? `<a href="#" class="btn-gold" style="font-size:11px;padding:8px 16px;">Modify</a>` : ""}
      </div>
    </div>
  </div>`,
        )
        .join("");
    </script>
  </body>
</html>
