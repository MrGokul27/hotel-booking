<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Guests - Stackly Hotel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Jost:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <link rel="stylesheet" href="../../assets/css/styles.css" />
    <link rel="stylesheet" href="../../assets/css/dashboard.css" />
    <style>
      .guest-card {
        background: var(--white);
        border: 1px solid #ede8e0;
        border-radius: 10px;
        padding: 20px;
        display: flex;
        align-items: center;
        gap: 16px;
        transition: all 0.22s;
      }
      .guest-card:hover {
        box-shadow: 0 6px 24px rgba(184, 154, 96, 0.12);
        transform: translateY(-2px);
        border-color: rgba(184, 154, 96, 0.4);
      }
      .guest-av {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        background: var(--dark);
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "Cormorant Garamond", serif;
        font-weight: 700;
        font-size: 18px;
        color: var(--gold);
        flex-shrink: 0;
      }
      .guest-meta {
        flex: 1;
        min-width: 0;
      }
      .guest-meta .name {
        font-size: 14px;
        font-weight: 500;
        color: var(--dark);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .guest-meta .email {
        font-size: 12px;
        color: var(--text-muted);
        margin-top: 2px;
      }
      .guest-meta .stays {
        font-size: 11px;
        color: var(--gold);
        font-weight: 500;
        margin-top: 4px;
      }
      .tier-badge {
        padding: 3px 10px;
        border-radius: 20px;
        font-size: 10px;
        font-weight: 500;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        flex-shrink: 0;
      }
      .tier-gold {
        background: rgba(184, 154, 96, 0.12);
        color: var(--gold);
      }
      .tier-silver {
        background: rgba(150, 150, 150, 0.12);
        color: #888;
      }
      .tier-platinum {
        background: rgba(52, 73, 94, 0.1);
        color: #34495e;
      }
      .guest-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 16px;
      }
    </style>
  </head>
  <body>
    <div class="db-wrapper">
      <aside class="db-sidebar" id="db-sidebar"></aside>
      <div class="db-sidebar-overlay" id="db-overlay"></div>
      <div class="db-main">
        <header class="db-topbar">
          <div class="db-topbar-left">
            <button class="db-menu-toggle" id="db-menu-toggle">
              <i class="fa-solid fa-bars"></i>
            </button>
            <div>
              <div class="db-page-title">Guests</div>
              <div class="db-breadcrumb">Admin · Guest Directory</div>
            </div>
          </div>
          <div class="db-topbar-right">
            <div class="db-topbar-date" id="db-date"></div>
            <button class="db-notif-btn">
              <i class="fa-regular fa-bell"></i
              ><span class="db-notif-badge"></span>
            </button>
            <div class="db-topbar-user">
              <div class="db-topbar-avatar" id="topbar-avatar">S</div>
              <span class="db-topbar-name" id="topbar-name">Admin</span>
            </div>
          </div>
        </header>
        <main class="db-content">
          <div class="db-kpi-grid" style="margin-bottom: 28px">
            <div class="db-kpi-card">
              <div class="db-kpi-header">
                <span class="db-kpi-label">Total Guests</span>
                <div class="db-kpi-icon"><i class="fa-solid fa-users"></i></div>
              </div>
              <div class="db-kpi-value">1,842</div>
              <div class="db-kpi-trend up">
                <i class="fa-solid fa-arrow-trend-up"></i> +64 this month
              </div>
            </div>
            <div class="db-kpi-card">
              <div class="db-kpi-header">
                <span class="db-kpi-label">In-House Now</span>
                <div class="db-kpi-icon">
                  <i class="fa-solid fa-person-shelter"></i>
                </div>
              </div>
              <div class="db-kpi-value">76</div>
              <div class="db-kpi-trend neutral">
                <i class="fa-solid fa-minus"></i> Across 76 rooms
              </div>
            </div>
            <div class="db-kpi-card">
              <div class="db-kpi-header">
                <span class="db-kpi-label">VIP / Members</span>
                <div class="db-kpi-icon"><i class="fa-solid fa-crown"></i></div>
              </div>
              <div class="db-kpi-value">312</div>
              <div class="db-kpi-trend up">
                <i class="fa-solid fa-arrow-trend-up"></i> 17% of total
              </div>
            </div>
            <div class="db-kpi-card">
              <div class="db-kpi-header">
                <span class="db-kpi-label">Avg. Stays / Guest</span>
                <div class="db-kpi-icon">
                  <i class="fa-solid fa-repeat"></i>
                </div>
              </div>
              <div class="db-kpi-value">3.4</div>
              <div class="db-kpi-trend up">
                <i class="fa-solid fa-arrow-trend-up"></i> +0.3 vs last yr
              </div>
            </div>
          </div>

          <!-- Toolbar -->
          <div class="db-card" style="margin-bottom: 22px">
            <div
              style="
                display: flex;
                align-items: center;
                justify-content: space-between;
                flex-wrap: wrap;
                gap: 12px;
              "
            >
              <div
                style="
                  display: flex;
                  gap: 10px;
                  flex-wrap: wrap;
                  align-items: center;
                "
              >
                <div style="position: relative">
                  <i
                    class="fa-solid fa-magnifying-glass"
                    style="
                      position: absolute;
                      left: 12px;
                      top: 50%;
                      transform: translateY(-50%);
                      color: var(--text-muted);
                      font-size: 13px;
                    "
                  ></i>
                  <input
                    id="guest-search"
                    type="text"
                    placeholder="Search name, email…"
                    oninput="renderGuests(this.value)"
                    style="
                      padding: 9px 14px 9px 36px;
                      border: 1px solid #ede8e0;
                      border-radius: 6px;
                      font-family: Jost, sans-serif;
                      font-size: 13px;
                      outline: none;
                      width: 220px;
                    "
                  />
                </div>
                <select
                  onchange="renderGuests('', this.value)"
                  style="
                    padding: 9px 14px;
                    border: 1px solid #ede8e0;
                    border-radius: 6px;
                    font-size: 13px;
                    outline: none;
                    background: white;
                    font-family: Jost, sans-serif;
                  "
                >
                  <option value="">All Tiers</option>
                  <option value="Gold">Gold</option>
                  <option value="Silver">Silver</option>
                  <option value="Platinum">Platinum</option>
                </select>
              </div>
              <a
                href="#"
                class="btn-gold"
                style="font-size: 11px; padding: 9px 20px"
                ><i class="fa-solid fa-user-plus me-2"></i>Add Guest</a
              >
            </div>
          </div>

          <div class="guest-grid" id="guest-grid"></div>
        </main>
      </div>
    </div>
    <script src="../../assets/js/db-shell.js"></script>
    <script>
      const guests = [
        {
          name: "Alexandra Moore",
          email: "a.moore@email.com",
          stays: 14,
          tier: "Platinum",
          room: "Suite 501",
          status: "In-House",
        },
        {
          name: "James Harrington",
          email: "j.harrington@corp.com",
          stays: 8,
          tier: "Gold",
          room: "Deluxe 204",
          status: "In-House",
        },
        {
          name: "Priya Sharma",
          email: "priya.s@email.com",
          stays: 5,
          tier: "Silver",
          room: "Room 108",
          status: "Arriving",
        },
        {
          name: "Marcus Lefevre",
          email: "m.lefevre@email.com",
          stays: 11,
          tier: "Gold",
          room: "Suite 302",
          status: "Confirmed",
        },
        {
          name: "Sophie Caldwell",
          email: "s.caldwell@email.com",
          stays: 22,
          tier: "Platinum",
          room: "Pres. Suite",
          status: "In-House",
        },
        {
          name: "Tariq Al-Farsi",
          email: "tariq.af@corp.com",
          stays: 3,
          tier: "Silver",
          room: "—",
          status: "Cancelled",
        },
        {
          name: "Ingrid Larsson",
          email: "i.larsson@email.com",
          stays: 7,
          tier: "Gold",
          room: "Room 112",
          status: "Confirmed",
        },
        {
          name: "Daniel Osei",
          email: "d.osei@email.com",
          stays: 2,
          tier: "Silver",
          room: "Deluxe 215",
          status: "In-House",
        },
        {
          name: "Mei Lin",
          email: "mei.lin@email.com",
          stays: 9,
          tier: "Gold",
          room: "Suite 402",
          status: "Confirmed",
        },
        {
          name: "Robert Khan",
          email: "r.khan@email.com",
          stays: 1,
          tier: "Silver",
          room: "Room 106",
          status: "Pending",
        },
        {
          name: "Chiara Romano",
          email: "c.romano@email.com",
          stays: 6,
          tier: "Gold",
          room: "Deluxe 308",
          status: "Confirmed",
        },
        {
          name: "Ivan Petrov",
          email: "i.petrov@corp.com",
          stays: 18,
          tier: "Platinum",
          room: "Pres. Suite",
          status: "Confirmed",
        },
      ];
      function renderGuests(q = "", tier = "") {
        const grid = document.getElementById("guest-grid");
        const list = guests.filter(
          (g) =>
            (!q ||
              g.name.toLowerCase().includes(q.toLowerCase()) ||
              g.email.toLowerCase().includes(q.toLowerCase())) &&
            (!tier || g.tier === tier),
        );
        const tierClass = {
          Gold: "tier-gold",
          Silver: "tier-silver",
          Platinum: "tier-platinum",
        };
        const initials = (n) =>
          n
            .split(" ")
            .map((w) => w[0])
            .slice(0, 2)
            .join("")
            .toUpperCase();
        grid.innerHTML = list
          .map(
            (g) => `
    <div class="guest-card">
      <div class="guest-av">${initials(g.name)}</div>
      <div class="guest-meta">
        <div class="name">${g.name}</div>
        <div class="email">${g.email}</div>
        <div class="stays"><i class="fa-solid fa-bed me-1"></i>${g.stays} stays · ${g.room}</div>
      </div>
      <div>
        <div class="tier-badge ${tierClass[g.tier]}" style="margin-bottom:6px;">${g.tier}</div>
        <div style="font-size:11px;text-align:center;color:var(--text-muted);">${g.status}</div>
      </div>
    </div>`,
          )
          .join("");
      }
      renderGuests();
    </script>
  </body>
</html>
