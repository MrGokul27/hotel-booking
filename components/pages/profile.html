<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Profile - Stackly Hotel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Jost:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <link rel="stylesheet" href="../../assets/css/styles.css" />
    <link rel="stylesheet" href="../../assets/css/dashboard.css" />
    <style>
      .profile-avatar-wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        margin-bottom: 24px;
      }
      .profile-avatar {
        width: 96px;
        height: 96px;
        border-radius: 50%;
        background: var(--dark);
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "Cormorant Garamond", serif;
        font-weight: 700;
        font-size: 36px;
        color: var(--gold);
        border: 3px solid var(--gold);
        margin-bottom: 12px;
      }
      .profile-name {
        font-family: "Cormorant Garamond", serif;
        font-size: 1.5rem;
        font-weight: 700;
        color: var(--dark);
      }
      .profile-email {
        font-size: 13px;
        color: var(--text-muted);
      }
      .profile-field {
        margin-bottom: 16px;
      }
      .profile-field label {
        display: block;
        font-size: 10px;
        font-weight: 500;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--gold);
        margin-bottom: 7px;
      }
      .profile-field input,
      .profile-field select,
      .profile-field textarea {
        width: 100%;
        padding: 11px 14px;
        border: 1px solid #ede8e0;
        border-radius: 6px;
        font-family: Jost, sans-serif;
        font-size: 13px;
        outline: none;
        transition:
          border-color 0.2s,
          box-shadow 0.2s;
        background: white;
      }
      .profile-field input:focus,
      .profile-field select:focus,
      .profile-field textarea:focus {
        border-color: var(--gold);
        box-shadow: 0 0 0 3px rgba(184, 154, 96, 0.1);
      }
      .pref-toggle {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 13px 0;
        border-bottom: 1px solid #f5f2ed;
      }
      .pref-toggle:last-child {
        border-bottom: none;
      }
      .toggle-switch {
        position: relative;
        width: 42px;
        height: 24px;
        flex-shrink: 0;
      }
      .toggle-switch input {
        opacity: 0;
        width: 0;
        height: 0;
      }
      .toggle-slider {
        position: absolute;
        inset: 0;
        background: #e0d8cf;
        border-radius: 24px;
        cursor: pointer;
        transition: 0.3s;
      }
      .toggle-slider::before {
        content: "";
        position: absolute;
        height: 18px;
        width: 18px;
        left: 3px;
        bottom: 3px;
        background: white;
        border-radius: 50%;
        transition: 0.3s;
      }
      .toggle-switch input:checked + .toggle-slider {
        background: var(--gold);
      }
      .toggle-switch input:checked + .toggle-slider::before {
        transform: translateX(18px);
      }
    </style>
  </head>
  <body>
    <div class="db-wrapper">
      <aside class="db-sidebar" id="db-sidebar"></aside>
      <div class="db-sidebar-overlay" id="db-overlay"></div>
      <div class="db-main">
        <header class="db-topbar">
          <div class="db-topbar-left">
            <button class="db-menu-toggle" id="db-menu-toggle">
              <i class="fa-solid fa-bars"></i>
            </button>
            <div>
              <div class="db-page-title">My Profile</div>
              <div class="db-breadcrumb">Account · Personal Details</div>
            </div>
          </div>
          <div class="db-topbar-right">
            <div class="db-topbar-date" id="db-date"></div>
            <button class="db-notif-btn">
              <i class="fa-regular fa-bell"></i
              ><span class="db-notif-badge"></span>
            </button>
            <div class="db-topbar-user">
              <div class="db-topbar-avatar" id="topbar-avatar">S</div>
              <span class="db-topbar-name" id="topbar-name">Guest</span>
            </div>
          </div>
        </header>
        <main class="db-content">
          <div class="db-grid-2" style="margin-bottom: 28px">
            <!-- Profile Form -->
            <div class="db-card">
              <div
                id="profile-avatar-section"
                class="profile-avatar-wrap"
              ></div>
              <form onsubmit="return false;">
                <div
                  style="
                    display: grid;
                    grid-template-columns: 1fr 1fr;
                    gap: 14px;
                  "
                >
                  <div class="profile-field">
                    <label>First Name</label
                    ><input
                      type="text"
                      id="first-name"
                      placeholder="First name"
                    />
                  </div>
                  <div class="profile-field">
                    <label>Last Name</label
                    ><input
                      type="text"
                      id="last-name"
                      placeholder="Last name"
                    />
                  </div>
                </div>
                <div class="profile-field">
                  <label
                    ><i class="fa-regular fa-envelope me-1"></i>Email
                    Address</label
                  ><input
                    type="email"
                    id="profile-email"
                    placeholder="your@email.com"
                  />
                </div>
                <div class="profile-field">
                  <label
                    ><i class="fa-solid fa-phone me-1"></i>Phone Number</label
                  ><input type="tel" placeholder="+1 (000) 000-0000" />
                </div>
                <div
                  style="
                    display: grid;
                    grid-template-columns: 1fr 1fr;
                    gap: 14px;
                  "
                >
                  <div class="profile-field">
                    <label>Nationality</label
                    ><input type="text" placeholder="United Kingdom" />
                  </div>
                  <div class="profile-field">
                    <label>Date of Birth</label><input type="date" />
                  </div>
                </div>
                <div class="profile-field">
                  <label>Special Dietary Requirements</label
                  ><textarea
                    placeholder="Vegetarian, gluten-free, allergies…"
                    style="resize: vertical; min-height: 80px"
                  ></textarea>
                </div>
                <button
                  class="btn-gold"
                  style="font-size: 11px; padding: 12px 28px"
                >
                  <i class="fa-solid fa-floppy-disk me-2"></i>Save Changes
                </button>
              </form>
            </div>

            <div style="display: flex; flex-direction: column; gap: 20px">
              <!-- Stay Preferences -->
              <div class="db-card">
                <div class="db-section-head">
                  <div class="db-section-title">Stay Preferences</div>
                </div>
                <div class="profile-field">
                  <label>Preferred Room Type</label
                  ><select>
                    <option>No Preference</option>
                    <option>Standard Room</option>
                    <option>Deluxe Room</option>
                    <option>Suite</option>
                  </select>
                </div>
                <div class="profile-field">
                  <label>Preferred Floor</label
                  ><select>
                    <option>No Preference</option>
                    <option>Low Floor (1–2)</option>
                    <option>Mid Floor (3–4)</option>
                    <option>High Floor (5)</option>
                  </select>
                </div>
                <div class="profile-field">
                  <label>Bed Preference</label
                  ><select>
                    <option>No Preference</option>
                    <option>King Bed</option>
                    <option>Queen Bed</option>
                    <option>Twin Beds</option>
                  </select>
                </div>
                <div class="profile-field">
                  <label>Special Requests</label
                  ><textarea
                    placeholder="Quiet room, extra pillows, early check-in…"
                    style="resize: vertical; min-height: 70px"
                  ></textarea>
                </div>
              </div>

              <!-- Notification Preferences -->
              <div class="db-card">
                <div class="db-section-head">
                  <div class="db-section-title">Notifications</div>
                </div>
                <div class="pref-toggle">
                  <div>
                    <div
                      style="
                        font-size: 13px;
                        font-weight: 500;
                        color: var(--dark);
                      "
                    >
                      Booking Confirmations
                    </div>
                    <div style="font-size: 11px; color: var(--text-muted)">
                      Email and SMS
                    </div>
                  </div>
                  <label class="toggle-switch"
                    ><input type="checkbox" checked /><span
                      class="toggle-slider"
                    ></span
                  ></label>
                </div>
                <div class="pref-toggle">
                  <div>
                    <div
                      style="
                        font-size: 13px;
                        font-weight: 500;
                        color: var(--dark);
                      "
                    >
                      Exclusive Offers
                    </div>
                    <div style="font-size: 11px; color: var(--text-muted)">
                      Member deals and promotions
                    </div>
                  </div>
                  <label class="toggle-switch"
                    ><input type="checkbox" checked /><span
                      class="toggle-slider"
                    ></span
                  ></label>
                </div>
                <div class="pref-toggle">
                  <div>
                    <div
                      style="
                        font-size: 13px;
                        font-weight: 500;
                        color: var(--dark);
                      "
                    >
                      Event Invitations
                    </div>
                    <div style="font-size: 11px; color: var(--text-muted)">
                      Upcoming hotel events
                    </div>
                  </div>
                  <label class="toggle-switch"
                    ><input type="checkbox" checked /><span
                      class="toggle-slider"
                    ></span
                  ></label>
                </div>
                <div class="pref-toggle">
                  <div>
                    <div
                      style="
                        font-size: 13px;
                        font-weight: 500;
                        color: var(--dark);
                      "
                    >
                      Points Updates
                    </div>
                    <div style="font-size: 11px; color: var(--text-muted)">
                      When you earn or redeem points
                    </div>
                  </div>
                  <label class="toggle-switch"
                    ><input type="checkbox" /><span class="toggle-slider"></span
                  ></label>
                </div>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>
    <script src="../../assets/js/db-shell.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const { nameFull, email } = window.DB || {};
        if (!nameFull) return;
        const [first, ...rest] = nameFull.split(" ");
        document.getElementById("first-name").value = first || "";
        document.getElementById("last-name").value = rest.join(" ") || "";
        document.getElementById("profile-email").value = email || "";
        const ini = nameFull
          .split(" ")
          .map((w) => w[0])
          .slice(0, 2)
          .join("")
          .toUpperCase();
        document.getElementById("profile-avatar-section").innerHTML =
          `<div class="profile-avatar">${ini}</div><div class="profile-name">${nameFull}</div><div class="profile-email">${email}</div>`;
      });
    </script>
  </body>
</html>
