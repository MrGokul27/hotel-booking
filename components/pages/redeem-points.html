<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redeem Points - Stackly Hotel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Jost:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <link rel="stylesheet" href="../../assets/css/styles.css" />
    <link rel="stylesheet" href="../../assets/css/dashboard.css" />
    <style>
      .pts-banner {
        background: linear-gradient(135deg, var(--dark), #2a221a);
        border-radius: 12px;
        padding: 24px 28px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 16px;
        margin-bottom: 28px;
        position: relative;
        overflow: hidden;
      }
      .pts-banner::before {
        content: "";
        position: absolute;
        top: -30px;
        right: -30px;
        width: 150px;
        height: 150px;
        border-radius: 50%;
        background: rgba(184, 154, 96, 0.07);
      }
      .pts-balance {
        font-family: "Cormorant Garamond", serif;
        font-size: 3rem;
        font-weight: 700;
        color: var(--gold);
        line-height: 1;
      }
      .reward-cat-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
        gap: 18px;
      }
      .reward-full-card {
        background: var(--white);
        border: 1px solid #ede8e0;
        border-radius: 10px;
        overflow: hidden;
        transition: all 0.22s;
      }
      .reward-full-card:hover {
        box-shadow: 0 8px 28px rgba(184, 154, 96, 0.13);
        transform: translateY(-3px);
      }
      .reward-full-header {
        background: linear-gradient(135deg, var(--dark), #1e1b14);
        padding: 20px;
        text-align: center;
      }
      .reward-full-icon {
        font-size: 28px;
        color: var(--gold);
        margin-bottom: 6px;
      }
      .reward-full-name {
        font-family: "Cormorant Garamond", serif;
        font-size: 1.2rem;
        font-weight: 700;
        color: var(--white);
      }
      .reward-full-body {
        padding: 16px 18px;
      }
      .reward-full-desc {
        font-size: 12px;
        color: var(--text-muted);
        line-height: 1.6;
        margin-bottom: 12px;
      }
      .reward-full-pts {
        font-family: "Cormorant Garamond", serif;
        font-size: 1.5rem;
        font-weight: 700;
        color: var(--gold);
      }
      .reward-full-footer {
        padding: 12px 18px;
        border-top: 1px solid #f0ece4;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .can-redeem {
        color: #27ae60;
        font-size: 11px;
        font-weight: 500;
      }
      .cant-redeem {
        color: #e74c3c;
        font-size: 11px;
      }
    </style>
  </head>
  <body>
    <div class="db-wrapper">
      <aside class="db-sidebar" id="db-sidebar"></aside>
      <div class="db-sidebar-overlay" id="db-overlay"></div>
      <div class="db-main">
        <header class="db-topbar">
          <div class="db-topbar-left">
            <button class="db-menu-toggle" id="db-menu-toggle">
              <i class="fa-solid fa-bars"></i>
            </button>
            <div>
              <div class="db-page-title">Redeem Points</div>
              <div class="db-breadcrumb">Membership · Rewards Catalogue</div>
            </div>
          </div>
          <div class="db-topbar-right">
            <div class="db-topbar-date" id="db-date"></div>
            <button class="db-notif-btn">
              <i class="fa-regular fa-bell"></i
              ><span class="db-notif-badge"></span>
            </button>
            <div class="db-topbar-user">
              <div class="db-topbar-avatar" id="topbar-avatar">S</div>
              <span class="db-topbar-name" id="topbar-name">Member</span>
            </div>
          </div>
        </header>
        <main class="db-content">
          <div class="pts-banner">
            <div style="position: relative; z-index: 1">
              <div
                style="
                  font-size: 10px;
                  font-weight: 500;
                  letter-spacing: 0.2em;
                  text-transform: uppercase;
                  color: rgba(255, 255, 255, 0.45);
                  margin-bottom: 6px;
                "
              >
                Your Balance
              </div>
              <div class="pts-balance">8,740 pts</div>
              <div
                style="
                  font-size: 12px;
                  color: rgba(255, 255, 255, 0.5);
                  margin-top: 4px;
                "
              >
                Gold Member · Expires Dec 2026
              </div>
            </div>
            <div style="position: relative; z-index: 1; text-align: right">
              <div
                style="
                  font-size: 12px;
                  color: rgba(255, 255, 255, 0.45);
                  margin-bottom: 4px;
                "
              >
                Points value
              </div>
              <div
                style="
                  font-family: &quot;Cormorant Garamond&quot;, serif;
                  font-size: 1.6rem;
                  font-weight: 700;
                  color: var(--white);
                "
              >
                ≈ $87.40
              </div>
              <div
                style="
                  font-size: 11px;
                  color: rgba(255, 255, 255, 0.3);
                  margin-top: 2px;
                "
              >
                1 pt = $0.01
              </div>
            </div>
          </div>

          <div class="db-section-head" style="margin-bottom: 18px">
            <div class="db-section-title">Rewards Catalogue</div>
          </div>
          <div class="reward-cat-grid" id="reward-grid"></div>
        </main>
      </div>
    </div>
    <script src="../../assets/js/db-shell.js"></script>
    <script>
      const BALANCE = 8740;
      const rewards = [
        {
          icon: "fa-bed",
          name: "Free Night Stay",
          desc: "Complimentary standard room for one night on any available date.",
          pts: 5000,
        },
        {
          icon: "fa-star",
          name: "Suite Upgrade",
          desc: "Upgrade your current or upcoming booking to a Deluxe or Suite room.",
          pts: 2000,
        },
        {
          icon: "fa-spa",
          name: "Spa Treatment",
          desc: "One 60-minute treatment — Swedish massage, hot stone or facial.",
          pts: 1200,
        },
        {
          icon: "fa-utensils",
          name: "Dinner for Two",
          desc: "3-course dinner at The Grand Table for two guests, inclusive of wine.",
          pts: 2500,
        },
        {
          icon: "fa-mug-saucer",
          name: "Breakfast for Two",
          desc: "Full English breakfast for two at The Atrium Café.",
          pts: 600,
        },
        {
          icon: "fa-clock",
          name: "Late Check-Out (4 PM)",
          desc: "Extend your departure until 4:00 PM at no extra charge.",
          pts: 500,
        },
        {
          icon: "fa-car",
          name: "Airport Transfer",
          desc: "Complimentary return airport transfer in our luxury house car.",
          pts: 1800,
        },
        {
          icon: "fa-champagne-glasses",
          name: "Welcome Amenity",
          desc: "Champagne & chocolate strawberries delivered to your room on arrival.",
          pts: 400,
        },
        {
          icon: "fa-crown",
          name: "Platinum Fast-Track",
          desc: "Donate 5,000 pts to instantly fast-track your tier to Platinum.",
          pts: 5000,
        },
        {
          icon: "fa-gift",
          name: "Concierge Gift Voucher",
          desc: "$50 hotel credit valid across all services — spa, dining, and extras.",
          pts: 3000,
        },
      ];
      document.getElementById("reward-grid").innerHTML = rewards
        .map((r) => {
          const can = BALANCE >= r.pts;
          return `<div class="reward-full-card">
    <div class="reward-full-header"><div class="reward-full-icon"><i class="fa-solid ${r.icon}"></i></div><div class="reward-full-name">${r.name}</div></div>
    <div class="reward-full-body"><div class="reward-full-desc">${r.desc}</div><div class="reward-full-pts">${r.pts.toLocaleString()} pts</div></div>
    <div class="reward-full-footer">
      <span class="${can ? "can-redeem" : "cant-redeem"}">${can ? '<i class="fa-solid fa-check me-1"></i>You can redeem' : '<i class="fa-solid fa-lock me-1"></i>' + (r.pts - BALANCE).toLocaleString() + " pts needed"}</span>
      <a href="#" class="${can ? "btn-gold" : "btn-outline-gold"}" style="font-size:11px;padding:7px 14px;${can ? "" : "opacity:.6;pointer-events:none;"}">Redeem</a>
    </div>
  </div>`;
        })
        .join("");
    </script>
  </body>
</html>
