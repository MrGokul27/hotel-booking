<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Promotions & Offers - Stackly Hotel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Jost:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <link rel="stylesheet" href="../../assets/css/styles.css" />
    <link rel="stylesheet" href="../../assets/css/dashboard.css" />
    <style>
      .promo-card {
        background: var(--white);
        border: 1px solid #ede8e0;
        border-radius: 10px;
        overflow: hidden;
        transition: all 0.22s;
      }
      .promo-card:hover {
        box-shadow: 0 8px 28px rgba(184, 154, 96, 0.14);
        transform: translateY(-3px);
      }
      .promo-header {
        background: linear-gradient(135deg, var(--dark), #2a221a);
        padding: 22px;
        position: relative;
      }
      .promo-header::after {
        content: "";
        position: absolute;
        top: -20px;
        right: -20px;
        width: 90px;
        height: 90px;
        border-radius: 50%;
        background: rgba(184, 154, 96, 0.08);
      }
      .promo-discount {
        font-family: "Cormorant Garamond", serif;
        font-size: 2.8rem;
        font-weight: 700;
        color: var(--gold);
        line-height: 1;
      }
      .promo-off {
        font-size: 13px;
        color: rgba(255, 255, 255, 0.6);
        margin-top: 2px;
      }
      .promo-body {
        padding: 18px 20px;
      }
      .promo-title {
        font-family: "Cormorant Garamond", serif;
        font-size: 1.2rem;
        font-weight: 700;
        color: var(--dark);
        margin-bottom: 6px;
      }
      .promo-desc {
        font-size: 12px;
        color: var(--text-muted);
        line-height: 1.6;
        margin-bottom: 12px;
      }
      .promo-meta {
        display: flex;
        gap: 16px;
        flex-wrap: wrap;
      }
      .promo-meta span {
        font-size: 11px;
        color: var(--text-muted);
        display: flex;
        align-items: center;
        gap: 5px;
      }
      .promo-meta i {
        color: var(--gold);
      }
      .promo-footer {
        padding: 12px 20px;
        border-top: 1px solid #f0ece4;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .promo-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 20px;
      }
      .status-active {
        background: rgba(39, 174, 96, 0.1);
        color: #27ae60;
        padding: 3px 10px;
        border-radius: 20px;
        font-size: 10px;
        font-weight: 500;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .status-draft {
        background: rgba(150, 150, 150, 0.12);
        color: #888;
        padding: 3px 10px;
        border-radius: 20px;
        font-size: 10px;
        font-weight: 500;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .status-expired {
        background: rgba(231, 76, 60, 0.1);
        color: #e74c3c;
        padding: 3px 10px;
        border-radius: 20px;
        font-size: 10px;
        font-weight: 500;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div class="db-wrapper">
      <aside class="db-sidebar" id="db-sidebar"></aside>
      <div class="db-sidebar-overlay" id="db-overlay"></div>
      <div class="db-main">
        <header class="db-topbar">
          <div class="db-topbar-left">
            <button class="db-menu-toggle" id="db-menu-toggle">
              <i class="fa-solid fa-bars"></i>
            </button>
            <div>
              <div class="db-page-title">Promotions & Offers</div>
              <div class="db-breadcrumb">Finance · Campaign Management</div>
            </div>
          </div>
          <div class="db-topbar-right">
            <div class="db-topbar-date" id="db-date"></div>
            <button class="db-notif-btn">
              <i class="fa-regular fa-bell"></i
              ><span class="db-notif-badge"></span>
            </button>
            <div class="db-topbar-user">
              <div class="db-topbar-avatar" id="topbar-avatar">S</div>
              <span class="db-topbar-name" id="topbar-name">Admin</span>
            </div>
          </div>
        </header>
        <main class="db-content">
          <div class="db-kpi-grid" style="margin-bottom: 28px">
            <div class="db-kpi-card">
              <div class="db-kpi-header">
                <span class="db-kpi-label">Active Offers</span>
                <div class="db-kpi-icon"><i class="fa-solid fa-tags"></i></div>
              </div>
              <div class="db-kpi-value">6</div>
              <div class="db-kpi-trend up">
                <i class="fa-solid fa-arrow-trend-up"></i> 2 ending soon
              </div>
            </div>
            <div class="db-kpi-card">
              <div class="db-kpi-header">
                <span class="db-kpi-label">Redemptions</span>
                <div class="db-kpi-icon">
                  <i class="fa-solid fa-ticket"></i>
                </div>
              </div>
              <div class="db-kpi-value">184</div>
              <div class="db-kpi-trend up">
                <i class="fa-solid fa-arrow-trend-up"></i> This month
              </div>
            </div>
            <div class="db-kpi-card">
              <div class="db-kpi-header">
                <span class="db-kpi-label">Revenue via Offers</span>
                <div class="db-kpi-icon">
                  <i class="fa-solid fa-dollar-sign"></i>
                </div>
              </div>
              <div class="db-kpi-value">$28.4K</div>
              <div class="db-kpi-trend up">
                <i class="fa-solid fa-arrow-trend-up"></i> +22% lift
              </div>
            </div>
            <div class="db-kpi-card">
              <div class="db-kpi-header">
                <span class="db-kpi-label">Avg. Discount</span>
                <div class="db-kpi-icon">
                  <i class="fa-solid fa-percent"></i>
                </div>
              </div>
              <div class="db-kpi-value">18%</div>
              <div class="db-kpi-trend neutral">
                <i class="fa-solid fa-minus"></i> Stable
              </div>
            </div>
          </div>

          <div
            style="
              display: flex;
              align-items: center;
              justify-content: space-between;
              margin-bottom: 20px;
              flex-wrap: wrap;
              gap: 12px;
            "
          >
            <div style="display: flex; gap: 8px; flex-wrap: wrap">
              <button
                onclick="filterPromos('')"
                class="filter-tab-btn active"
                style="
                  padding: 7px 18px;
                  border: 1px solid var(--gold);
                  border-radius: 20px;
                  font-size: 12px;
                  background: var(--gold);
                  color: white;
                  cursor: pointer;
                "
              >
                All
              </button>
              <button
                onclick="filterPromos('active')"
                class="filter-tab-btn"
                style="
                  padding: 7px 18px;
                  border: 1px solid #ede8e0;
                  border-radius: 20px;
                  font-size: 12px;
                  background: white;
                  cursor: pointer;
                "
              >
                Active
              </button>
              <button
                onclick="filterPromos('draft')"
                class="filter-tab-btn"
                style="
                  padding: 7px 18px;
                  border: 1px solid #ede8e0;
                  border-radius: 20px;
                  font-size: 12px;
                  background: white;
                  cursor: pointer;
                "
              >
                Draft
              </button>
              <button
                onclick="filterPromos('expired')"
                class="filter-tab-btn"
                style="
                  padding: 7px 18px;
                  border: 1px solid #ede8e0;
                  border-radius: 20px;
                  font-size: 12px;
                  background: white;
                  cursor: pointer;
                "
              >
                Expired
              </button>
            </div>
            <a
              href="#"
              class="btn-gold"
              style="font-size: 11px; padding: 9px 20px"
              ><i class="fa-solid fa-plus me-2"></i>Create Offer</a
            >
          </div>

          <div class="promo-grid" id="promo-grid"></div>
        </main>
      </div>
    </div>
    <script src="../../assets/js/db-shell.js"></script>
    <script>
      const promos = [
        {
          discount: "25%",
          off: "Off Standard Rooms",
          title: "Summer Escape Package",
          desc: "Book 3+ nights and save 25% on standard rooms. Includes daily breakfast for two.",
          valid: "01 Jul – 31 Aug 2025",
          uses: "62 / 100",
          code: "SUMMER25",
          status: "active",
        },
        {
          discount: "30%",
          off: "Off Suites",
          title: "Honeymoon Retreat",
          desc: "Exclusive suite discount with rose petal turndown, champagne on arrival & late checkout.",
          valid: "01 Jun – 30 Sep 2025",
          uses: "28 / 50",
          code: "HONEY30",
          status: "active",
        },
        {
          discount: "20%",
          off: "Off Spa Services",
          title: "Wellness Weekend",
          desc: "Enjoy 20% off all spa treatments when booked with a minimum 2-night stay.",
          valid: "Every Fri–Sun",
          uses: "94 / 200",
          code: "WELLNES20",
          status: "active",
        },
        {
          discount: "15%",
          off: "Corporate Rate",
          title: "Business Traveller",
          desc: "Preferred corporate pricing for extended stays of 5+ nights. Includes meeting room access.",
          valid: "Ongoing",
          uses: "156 / —",
          code: "CORP15",
          status: "active",
        },
        {
          discount: "40%",
          off: "Off All Rooms",
          title: "Early Bird Winter",
          desc: "Book 60+ days in advance for winter stays and save 40%. Non-refundable rate applies.",
          valid: "01 Dec – 28 Feb 2026",
          uses: "0 / 80",
          code: "WINTER40",
          status: "draft",
        },
        {
          discount: "35%",
          off: "Off Dining",
          title: "Festive Dining Experience",
          desc: "Exclusive festive menu with 35% off à la carte dining for hotel guests only.",
          valid: "20 Dec – 02 Jan 2026",
          uses: "0 / 120",
          code: "FEAST35",
          status: "draft",
        },
        {
          discount: "20%",
          off: "Off Deluxe Rooms",
          title: "Spring Rejuvenation",
          desc: "Spring season special — 20% off deluxe rooms with complimentary airport transfer.",
          valid: "01 Mar – 31 May 2025",
          uses: "88 / 80",
          code: "SPRING20",
          status: "expired",
        },
      ];
      let allPromos = [...promos];
      function filterPromos(s) {
        allPromos = s ? promos.filter((p) => p.status === s) : [...promos];
        renderPromos();
      }
      function renderPromos() {
        const statusEl = {
          active: '<span class="status-active">Active</span>',
          draft: '<span class="status-draft">Draft</span>',
          expired: '<span class="status-expired">Expired</span>',
        };
        document.getElementById("promo-grid").innerHTML = allPromos
          .map(
            (p) => `
    <div class="promo-card">
      <div class="promo-header">
        <div class="promo-discount">${p.discount}</div>
        <div class="promo-off">${p.off}</div>
      </div>
      <div class="promo-body">
        <div class="promo-title">${p.title}</div>
        <div class="promo-desc">${p.desc}</div>
        <div class="promo-meta">
          <span><i class="fa-solid fa-calendar"></i>${p.valid}</span>
          <span><i class="fa-solid fa-ticket"></i>${p.uses} used</span>
        </div>
      </div>
      <div class="promo-footer">
        <code style="font-size:12px;background:#f4f1ec;padding:4px 10px;border-radius:4px;color:var(--gold);font-weight:500;">${p.code}</code>
        <div style="display:flex;align-items:center;gap:10px;">${statusEl[p.status]}<a href="#" class="db-view-all" style="font-size:11px;">Edit</a></div>
      </div>
    </div>`,
          )
          .join("");
      }
      renderPromos();
    </script>
  </body>
</html>
